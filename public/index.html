<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PolyBot</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span> PolyBot
      <span id="mode" class="pill">…</span>
      <span id="source" class="pill">…</span>
    </div>
    <div class="equity">
      <div class="equity-val" id="equity">$0</div>
      <div class="equity-pnl" id="pnl">—</div>
    </div>
  </header>

  <main>
    <section class="controls">
      <button id="toggleRun" class="btn primary">Start</button>
      <button id="flatten" class="btn">Flatten</button>
      <button id="reset" class="btn ghost">Reset</button>
      <div class="strategies" id="strategies"></div>
    </section>

    <section class="stats" id="stats"></section>

    <nav class="tabs">
      <button class="tab active" data-tab="markets">Markets</button>
      <button class="tab" data-tab="positions">Positions</button>
      <button class="tab" data-tab="activity">Activity</button>
      <button class="tab" data-tab="copy">Copy</button>
    </nav>

    <section class="panel active" id="panel-markets"></section>
    <section class="panel" id="panel-positions"></section>
    <section class="panel" id="panel-activity"></section>
    <section class="panel" id="panel-copy"></section>
  </main>

  <!-- manual trade sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="tradeSheet">
    <div class="sheet-handle"></div>
    <h3 id="sheetTitle">Trade</h3>
    <div class="seg" id="sideSeg">
      <button class="seg-btn active" data-side="BUY">Buy</button>
      <button class="seg-btn" data-side="SELL">Sell</button>
    </div>
    <div class="seg" id="outcomeSeg">
      <button class="seg-btn active" data-outcome="YES">YES</button>
      <button class="seg-btn" data-outcome="NO">NO</button>
    </div>
    <label class="field">Size (USDC)
      <input id="sizeInput" type="number" inputmode="decimal" value="200" min="1" />
    </label>
    <div class="sheet-quote" id="sheetQuote"></div>
    <button class="btn primary block" id="submitOrder">Execute</button>
    <button class="btn ghost block" id="cancelOrder">Cancel</button>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
